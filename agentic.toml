[repo]
name = "bedrock"

rules = [
  "s001-no-duplicate-ui-code",
  "s002-all-grids-wired-to-admin-config",
  "s003-logging-protocol",
  "s004-no-hardcoded-config-settings",
  "s005-test-coverage-mandatory",
  "s006-sdlc-and-pr-workflow",
  "s007-schema-catalog",
  "s008-documentation-layout-and-naming",
  "s009-design-system",
  "s010-granular-security-model",
  "s011-config-driven-navigation",
  "s012-dual-pin-platform-governance",
  "s013-api-standards",
  "s014-issue-logging-and-ecosystem-governance",
  "s015-release-automation-and-changelog-contract"
]

skills = [
  "align-and-clean-repos",
  "brainstorming",
  "bump-bedrock-pin",
  "claude-review",
  "cut-release",
  "deliver-plan",
  "deliver-task",
  "doc-create",
  "doc-update",
  "finalize-pr",
  "grid-guru",
  "implement-issue"
  "issue-review",
  "issue-triage",
  "react-best-practices",
  "receiving-code-review",
  "requesting-code-review",
  "review-plans",
  "run-tests",
  "sql-sentinel",
  "stitch-bedrock-sync",
  "systematic-debugging",
  "tanstack-intent",
  "test-driven-development",
  "verification-before-completion",
  "writing-plans",
  "writing-skills"
]

agents = [
  "backend-api-engineer",
  "frontend-ui-engineer",
  "quality-gatekeeper",
  "plan-orchestrator",
]

hooks = [
  "pre-tool-guard.ps1",
]

scripts = [
  "Invoke-PlanRunner.ps1",
  "Invoke-PlanSupervisor.ps1",
  "task-contract.md",
  "Convert-PlanToIntake.ps1",
  "PROMPT_BUILD_INTAKE.md",
]
