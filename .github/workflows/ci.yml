name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: bedrock-api (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/bedrock-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest

  frontend:
    name: bedrock-ui (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/bedrock-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install peer dependencies
        # The package ships source and declares only peers, so CI installs
        # them directly to type-check against the versions consumers get.
        run: npm install --no-save $(node -p "Object.entries(require('./package.json').peerDependencies).map(([k,v])=>k+'@'+v).join(' ')") typescript @types/react @types/react-dom vite
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json
