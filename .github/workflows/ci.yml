name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  workflows:
    name: workflow files parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # A workflow file that does not parse fails as a 0s run with no jobs and
      # no check attached to any PR — v0.6.0 shipped a cascade.yml that had
      # been broken since it was written because nothing here ever read it.
      # safe_load rejects the specific defect that caused it: a bare `---` at
      # column 1 inside a `run: |` block, which ends the YAML document.
      - name: Parse every workflow as a single YAML document
        run: |
          python - <<'PY'
          import pathlib, sys, yaml
          failed = False
          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  yaml.safe_load(path.read_text(encoding="utf-8"))
              except yaml.YAMLError as exc:
                  print(f"{path}: {exc}", file=sys.stderr)
                  failed = True
              else:
                  print(f"{path}: ok")
          sys.exit(1 if failed else 0)
          PY

  backend:
    name: bedrock-api (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/bedrock-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest

  frontend:
    name: bedrock-ui (vitest + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        # The package ships source and declares only peers. npm 7+ installs
        # peerDependencies alongside devDependencies, so a plain `npm install`
        # now gets both — the manual peer install this replaced predates the
        # test stack being declared at all.
        #
        # Note the absence of --legacy-peer-deps: it makes npm skip the peer
        # install entirely, and both the type check and the tests then pass on
        # modules that are not there.
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Type check
        # After the tests, so a genuine failure is reported rather than a
        # missing matcher type on a test file.
        run: npm run typecheck
