name: Encoding & Line Ending Hygiene

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-encoding:
    name: check-encoding
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run byte-level encoding hygiene scanner
        run: |
          curl -sSL https://raw.githubusercontent.com/djntechnic/bedrock-ai-kit/master/scripts/maintenance/managed/check_encoding_hygiene.py -o check_encoding_hygiene.py
          python check_encoding_hygiene.py
