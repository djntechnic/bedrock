name: Cascade adoption issues

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to cascade — for re-running against an already-published release
        required: true

jobs:
  file-adoption-issues:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        consumer: [djntechnic/CollectIt, djntechnic/MLBTracker]
    steps:
      - name: Extract the "For consumers" section
        id: extract
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_BODY: ${{ github.event.release.body }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            BODY=$(gh release view "$TAG" --repo "$REPO" --json body --jq .body)
          else
            TAG="$EVENT_TAG"
            BODY="$EVENT_BODY"
          fi
          section=$(printf '%s' "$BODY" | awk '/^## For consumers/{flag=1} /^## /{if(flag && !/^## For consumers/) exit} flag')
          if [ -z "$section" ]; then
            echo "Release $TAG has no '## For consumers' section." >&2
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo 'section<<CASCADE_EOF'
            printf '%s\n' "$section"
            echo 'CASCADE_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: File the adoption issue
        env:
          GH_TOKEN: ${{ secrets.CASCADE_TOKEN }}
          CONSUMER: ${{ matrix.consumer }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.extract.outputs.tag }}
          SECTION: ${{ steps.extract.outputs.section }}
        run: |
          # Every line of the body is built here rather than written inline as
          # YAML. A horizontal rule at column 1 inside a block scalar is a YAML
          # document separator: it makes the whole workflow file unparseable,
          # which GitHub reports as a 0s failed run with no jobs — long after
          # the release it was meant to cascade.
          {
            printf '%s\n\n' "$SECTION"
            printf -- '---\n\n'
            printf 'Filed automatically on the publication of [bedrock %s](https://github.com/%s/releases/tag/%s).\n\n' "$TAG" "$REPO" "$TAG"
            printf 'Close this issue one of two ways:\n\n'
            printf -- '- **Boarded** — both pins moved to `%s`, adoptions applied, deletions done.\n' "$TAG"
            printf -- '- **Declined** — close with a comment recording *why* this release is being skipped.\n\n'
            printf 'Do not close it silently. A release nobody decided about is how a consumer ends up three releases behind.\n'
          } > "$RUNNER_TEMP/adoption-body.md"
          gh issue create --repo "$CONSUMER" \
            --title "Adopt bedrock $TAG" \
            --label cascade:pending \
            --body-file "$RUNNER_TEMP/adoption-body.md"

  close-upstream-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the release tag and body
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_BODY: ${{ github.event.release.body }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            BODY=$(gh release view "$TAG" --repo "$REPO" --json body --jq .body)
          else
            TAG="$EVENT_TAG"
            BODY="$EVENT_BODY"
          fi
          {
            echo "tag=$TAG"
            echo 'body<<CASCADE_EOF'
            printf '%s\n' "$BODY"
            echo 'CASCADE_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Close every resolved upstream issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
          BODY: ${{ steps.resolve.outputs.body }}
        run: |
          issues_line=$(printf '%s' "$BODY" | grep -m1 '\*\*Resolves Upstream Issues:\*\*' || true)
          if [ -z "$issues_line" ]; then
            echo "No 'Resolves Upstream Issues' key found in release $TAG body; nothing to close." >&2
            exit 0
          fi
          issue_numbers=$(printf '%s' "$issues_line" | grep -oE '#[0-9]+' | tr -d '#')
          if [ -z "$issue_numbers" ]; then
            echo "Resolves Upstream Issues is 'None' or unparseable for $TAG; nothing to close." >&2
            exit 0
          fi
          for issue in $issue_numbers; do
            gh issue comment "$issue" --repo "$REPO" --body "Resolved and verified in bedrock release \`$TAG\`."
            gh issue close "$issue" --repo "$REPO" --reason completed
          done

  sync-standards-to-ai-kit:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the release tag
        id: resolve
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$EVENT_TAG}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check out bedrock at the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          path: bedrock

      - name: Check out bedrock-ai-kit
        uses: actions/checkout@v4
        with:
          repository: djntechnic/bedrock-ai-kit
          token: ${{ secrets.CASCADE_TOKEN }}
          path: bedrock-ai-kit

      - name: Mirror and compile the standards
        # All three directories are passed explicitly: the script's defaults are
        # built with backslash separators, which are not paths on a Linux runner.
        shell: pwsh
        run: |
          ./bedrock-ai-kit/scripts/Sync-RulesFromStandards.ps1 `
            -StandardsSourceDir "$PWD/bedrock/docs/standards" `
            -StandardsTargetDir "$PWD/bedrock-ai-kit/docs/standards" `
            -RulesTargetDir "$PWD/bedrock-ai-kit/rules"

      - name: Open the sync PR
        working-directory: bedrock-ai-kit
        env:
          GH_TOKEN: ${{ secrets.CASCADE_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "bedrock-ai-kit already matches the standards at $TAG; nothing to sync."
            exit 0
          fi
          BRANCH="feat/standards-sync-$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "feat(standards): sync platform standards from bedrock $TAG"
          git push --force-with-lease origin "$BRANCH"
          # Built with printf rather than inline YAML, as in the adoption job.
          {
            printf 'Mirrors `docs/standards/` from [bedrock %s](https://github.com/%s/releases/tag/%s) and recompiles `rules/`.\n\n' "$TAG" "$REPO" "$TAG"
            printf 'Filed automatically by the bedrock cascade workflow (§S015).\n'
          } > "$RUNNER_TEMP/sync-body.md"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "A sync PR for $BRANCH is already open; branch updated."
            exit 0
          fi
          gh pr create --draft --base master --head "$BRANCH" \
            --title "feat(standards): sync platform standards from bedrock $TAG" \
            --body-file "$RUNNER_TEMP/sync-body.md"
