[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bedrock-api"
version = "0.6.2"
description = "Reusable FastAPI application platform: grid config, auth, app config, schema catalog"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic[email]",
    "pandas",
    "loguru",
    "python-dotenv",
    "slowapi",
    "passlib[bcrypt]>=1.7.4",
    # bcrypt 4.1 removed the `__about__` attribute that passlib 1.7.x
    # introspects to detect the backend version. passlib traps that
    # AttributeError, then — unable to tell whether the backend has the 2011
    # wraparound bug — falls back to a probe that hashes a >72-byte value.
    # bcrypt 5.0 raises on over-length input instead of truncating, so the
    # probe throws and *every* hash fails, reporting "password cannot be
    # longer than 72 bytes" for a 5-character password. Pin until passlib 1.8
    # ships; 1.7.4 is from 2020. MLBTracker already carries this same pin in
    # its requirements.txt — it belongs here, with the code that hashes.
    "bcrypt>=4.0.1,<4.1",
    "python-jose[cryptography]",
    "httpx",
    "httpx-oauth",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary"]
# pyyaml parses deploy/docker-compose.yml in test_deployment.py — the
# manifests are checked for the invariants that break a deploy silently.
dev = ["pytest", "pytest-asyncio", "httpx", "pyyaml"]

# Operational entry points. `bedrock-healthcheck` is what a container's
# HEALTHCHECK runs — see deploy/Dockerfile.api and docs/deployment.md.
[project.scripts]
bedrock-healthcheck = "bedrock.tools.healthcheck:main"

[tool.setuptools.packages.find]
include = ["bedrock*"]

# The schema ships with the code. `include_package_data` defaults to true for a
# pyproject-configured build, so these files are already installed today — this
# says so explicitly rather than relying on a default, because the failure mode
# if it ever changes is the quiet kind: the source tree works and the installed
# package has no baseline and no migrations.
[tool.setuptools.package-data]
bedrock = ["schema/*.sql", "schema/migrations/*.sql"]
