[pytest]
testpaths = tests
addopts = -q --tb=short --strict-markers
markers =
    fast: pure unit test - no DB, no network, no filesystem beyond tmp_path
    unit: standard unit/mock test - may use in-memory fixtures, no live DB
    integration: needs a populated database, migrations, or an sqlite clone rather than the empty baseline

filterwarnings =
    ignore::DeprecationWarning
