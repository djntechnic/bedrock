[tool.bedrock]
schema_catalog = "packages/bedrock-api/bedrock/core/schema_catalog.py"
grids_dir = "packages/bedrock-ui/src/components/DataGrid"

[tool.bedrock.audit.s001]
exemptions = [
  "dist/**",
  "packages/bedrock-ui/dist/**",
  # This repo is the platform source, not a consumer: everything under
  # packages/bedrock-ui/src/ (including components/ui/) IS the barrel's
  # implementation, so relative imports from it are not a local twin.
  "packages/bedrock-ui/src/**",
]

[tool.bedrock.audit.s002]
presentational_tables = [
  "packages/bedrock-ui/src/components/admin/ConfigEditor.tsx",
  "packages/bedrock-ui/src/components/admin/LogViewer.tsx",
  "packages/bedrock-ui/src/components/admin/MenuNavEditorPanel.tsx",
  "packages/bedrock-ui/src/components/admin/PlatformHealthPanel.tsx",
  "packages/bedrock-ui/src/components/admin/RoleMatrixPanel.tsx",
  "packages/bedrock-ui/src/components/admin/SecurityLogViewer.tsx",
  "packages/bedrock-ui/src/components/admin/UserOverridesDrawer.tsx",
  "packages/bedrock-ui/src/components/admin/UsersPanel.tsx",
  "packages/bedrock-ui/src/components/grids/PresentationalTableChrome.tsx",
  "packages/bedrock-ui/src/components/ui/table.tsx",
]
exemptions = []

[tool.bedrock.audit.s003]
exemptions = []

[tool.bedrock.audit.s004]
config_module = "bedrock.core.config"
exemptions = []

[tool.bedrock.audit.s005]
exemptions = []

