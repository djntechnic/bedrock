# Local stack: the API and the SPA behind nginx, on SQLite.
#
# This is the development and single-host production shape. It is not a
# clustering story — see docs/deployment.md for what changes when you run more
# than one API container.
#
#   docker compose -f deploy/docker-compose.yml up --build
#   → http://localhost:8080
#
# Copy deploy/.env.example to .env at the repository root first. Compose reads
# it, and so does bedrock itself inside the container.
#
# SQLite by default, because that is the engine bedrock actually supports
# (issue #25). This file used to start Postgres and hand the API a
# `postgresql://` URL, which meant the reference stack could never boot: the
# baseline schema is SQLite dialect, so the first CREATE TABLE fails and takes
# the container with it. The `db` service is kept, behind a profile, so that
# finishing the Postgres path is a matter of making the schema dialect-aware
# rather than rebuilding the deployment — but it is opt-in and it does not
# work yet. Read the profile comment before you reach for it.

services:
  db:
    # Opt-in only: `docker compose --profile postgres up`. WITHOUT the profile
    # this service does not start, which is deliberate.
    #
    # The profile does not currently produce a working stack. bedrock's
    # baseline.sql and seed.sql are SQLite dialect and the integrity and
    # diagnostic checks issue PRAGMA / sqlite_master unconditionally, so an API
    # pointed at Postgres fails while applying migrations at boot. Everything
    # below is correct Postgres plumbing waiting on that work; it is kept so
    # the container, healthcheck and credential handling do not have to be
    # rediscovered. See issue #25.
    #
    # Restoring it is two edits, not one: this profile line comes off, and
    # `api` regains both the DATABASE_URL override and a
    # `depends_on: db: condition: service_healthy`. The depends_on cannot stay
    # while the profile does — Compose pulls a depended-on service in
    # regardless of its profile, which would start Postgres for everybody and
    # undo the gate.
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bedrock}
      # No default, but deliberately not the `${VAR:?message}` required form:
      # Compose interpolates the whole file before it filters by profile, so
      # `:?` would abort `docker compose up` for everyone, profile or not —
      # the very breakage this file was fixed for. Unset, Postgres itself
      # refuses to initialise and says so.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bedrock}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Not published to the host by default. An exposed Postgres with a
    # development password is the single most common way one of these stacks
    # gets owned; uncomment only when you need a local client, and then only
    # bound to loopback.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      # `-U`/`-d` matter: the default `pg_isready` probes a database named
      # after the OS user, which does not exist here, so the check would fail
      # forever and the API would never start.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bedrock} -d ${POSTGRES_DB:-bedrock}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file:
      - ../.env
    environment:
      # No DATABASE_URL: unset means SQLite in the data volume below, which is
      # the engine the baseline schema is written for. This line used to
      # override .env with `postgresql://…@db:5432/…`, which is why the stack
      # could not boot. When the Postgres path is finished, the override
      # belongs back here — inside the network the host is `db`, not localhost,
      # and getting that wrong is the first thing that breaks when a working
      # local .env is reused for compose.
      PORT: "8000"
    volumes:
      # Uploads and any SQLite file. Named rather than bind-mounted so it
      # survives `docker compose down` and does not inherit host ownership.
      - api_data:/app/data
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        # Empty: the browser talks to nginx, which proxies /api to the API
        # container. One origin, no CORS.
        VITE_API_BASE_URL: ""
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
  api_data:
