# nginx config for a bedrock SPA.
#
# Two jobs: serve the built bundle with history fallback, and proxy /api to the
# API container so the browser sees one origin. Same-origin is what lets the
# image carry an empty VITE_API_BASE_URL and work in any environment — and it
# sidesteps CORS entirely rather than configuring it.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress what benefits. Not images — they are already compressed, and
    # gzipping them spends CPU to make them marginally larger.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints these filenames, so the content at a given URL never
    # changes and a year is safe. `immutable` additionally stops the browser
    # revalidating on reload.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the entry document. It is the file that names the current
    # asset hashes, so a cached copy pins a returning visitor to a deployment
    # whose assets have already been deleted — the classic white screen after
    # a deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    location /api/ {
        # `api` is the service name in docker-compose.yml.
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # bedrock's rate limiter and audit log read the client IP from
        # X-Forwarded-For and fall back to the socket address. Without this
        # every request appears to come from the proxy, so one visitor
        # exhausting a limit locks out everyone and the security log records
        # the container's IP for every event.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # History fallback. A deep link is a client-side route, so the server must
    # answer with the shell and let the router resolve it — otherwise every
    # bookmarked URL and every emailed password-reset link 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
